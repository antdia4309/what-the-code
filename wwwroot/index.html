<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#EAF1F8" />
    <meta name="description" content="A free puzzle game that teaches coding: build a program from blocks, run it, and see the real C# behind it." />
    <title>What the CODE?</title>

    <!-- Link previews (LinkedIn, Slack, X, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="What the CODE?" />
    <meta property="og:title" content="What the CODE? – a coding puzzle game" />
    <meta property="og:description" content="Program a bot with blocks and see the real C# behind it. 12 free levels, from first steps to maze-solving." />
    <meta property="og:url" content="https://antdia4309.github.io/what-the-code/" />
    <meta property="og:image" content="https://antdia4309.github.io/what-the-code/social-preview.png" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="640" />
    <meta property="og:image:alt" content="What the CODE? A bot on a spiral maze next to the C# program driving it." />
    <meta name="twitter:card" content="summary_large_image" />
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=JetBrains+Mono:wght@400;700&family=Nunito:wght@400;600&display=swap" />
    <script>
        // Pick light or dark before anything is drawn, so there's no flash of the wrong theme.
        // js/app.js keeps it in sync afterwards (wtc.theme).
        (function () {
            var choice = null;
            try { choice = localStorage.getItem('whatthecode.theme'); } catch (e) { }
            var dark = choice === 'dark' ||
                (choice !== 'light' && !!window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
            document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        })();
    </script>
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="WhatTheCode.styles.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <div class="boot">
            <span class="boot-bot" aria-hidden="true">🤖</span>
            <p>Booting up the bot…</p>
        </div>
    </div>

    <div id="blazor-error-ui">
        Something went wrong.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="js/app.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
